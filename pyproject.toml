[project]
name = "demandcast"
version = "0.1.0"
description = "End-to-end demand forecasting, statistical analysis, and warehouse capacity planning platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.3.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pytest>=8.0.0",
    "joblib>=1.4.0",
    "ruff>=0.5.0",
    "pyyaml>=6.0.0",
    "mlflow>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[tool.uv.sources]
demandcast = { path = ".", editable = false }

[tool.uv]
dev-dependencies = [
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "W", "C90", "UP", "B", "SIM", "T20"]
lint.ignore = ["S101", "T201"]
format.quote-style = "double"
format.indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]
"notebooks/*" = ["T201", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true